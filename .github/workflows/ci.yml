name: check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The project has no runtime or dev dependencies, so there is nothing to
      # install — that is deliberate, and this asserts it stays true.
      - name: Assert no dependencies
        run: |
          node -e '
            const p = require("./package.json");
            const deps = { ...p.dependencies, ...p.devDependencies };
            if (Object.keys(deps).length) {
              console.error("Unexpected dependencies:", Object.keys(deps).join(", "));
              process.exit(1);
            }
            console.log("no dependencies, as expected");
          '

      - name: Build, test and validate
        run: npm run check

      # data/items.json is generated from data/ratings.psv. If someone edited
      # the ratings without rebuilding, the committed artefact is stale.
      - name: Assert generated files are current
        run: |
          if ! git diff --exit-code -- data/items.json; then
            echo "::error::data/items.json is out of date — run 'npm run build' and commit the result"
            exit 1
          fi
