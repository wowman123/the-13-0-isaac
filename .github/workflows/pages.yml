name: deploy

on:
  push:
    # Deploy whatever the repository's default branch happens to be, rather
    # than a hardcoded name — the job below gates on it. This repo's default
    # is not `main`, and hardcoding it meant this workflow never fired.
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_dispatch has no branch filter, so gate here rather than on the
    # trigger: a manual run from a side branch should not publish it.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validate before publishing
        run: npm run check

      # Assemble only what the site serves. The tools and the test suite have
      # no business being published.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets src data _site/
          cp 404.html robots.txt manifest.webmanifest sw.js _site/
          touch _site/.nojekyll
          rm -f _site/assets/og-template.html _site/assets/icon-template.html
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
