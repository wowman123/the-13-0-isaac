name: deploy

on:
  push:
    # Deploy whatever the repository's default branch happens to be, rather
    # than a hardcoded name — the job below gates on it. This repo's default
    # is not `main`, and hardcoding it meant this workflow never fired.
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Two gates, both needed:
    #  - workflow_dispatch has no branch filter, so a manual run from a side
    #    branch must not publish it.
    #  - Pages is unavailable for a private repo on GitHub Free. Skipping while
    #    private reports this honestly as "not applicable" rather than failing
    #    red on every push for something that is not a code problem. The job
    #    starts running by itself the moment the repo is made public.
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build and validate before publishing
        run: npm run check

      # Assemble only what the site serves. The tools and the test suite have
      # no business being published.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html assets src data _site/
          cp 404.html robots.txt manifest.webmanifest sw.js _site/
          touch _site/.nojekyll
          rm -f _site/assets/og-template.html _site/assets/icon-template.html
          du -sh _site

      # enablement turns Pages on via the API if it is not already, so going
      # public is the only manual step — no Settings visit required.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
